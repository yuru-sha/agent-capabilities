schema: 1
id: github
kind: workflow
description: GitHub operation Skills from the operations/github pack, excluding commit and push.

skills:
  include:
    - packs/operations/github/skills/create-pr/**
    - packs/operations/github/skills/create-draft-pr/**
    - packs/operations/github/skills/mark-pr-ready/**
    - packs/operations/github/skills/request-copilot-review/**
    - packs/operations/github/skills/github-release/**
    - packs/operations/github/skills/create-issue/**
    - packs/operations/github/skills/security-alerts/**
    - packs/operations/github/skills/post-merge-cleanup/**

agents:
  include: []

external_skills:
  - gh-fix-ci
